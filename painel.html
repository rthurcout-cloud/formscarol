<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel · Carolina Rodrigues</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{ --wine:#4b1018; --cream:#f7eee6; --ink:#3b1d1d; --muted:#725e57; --line:rgba(75,16,24,.18); --gold:#a17d70; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}
  .serif{font-family:Georgia,serif}
  header{background:var(--wine);color:#fff;padding:22px 6vw;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header .brand .nm{font-family:Georgia,serif;font-size:22px;letter-spacing:.5px}
  header .brand .sb{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#e8cfc6;margin-top:2px}
  header .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .wrap{max-width:1100px;margin:0 auto;padding:26px 6vw 60px}

  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--wine);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-weight:bold}
  .btn.light{background:#fff;color:var(--wine);border:1px solid rgba(255,255,255,.5)}
  .btn.ghost{background:transparent;color:var(--wine);border:1px solid var(--line)}
  .btn.sm{padding:7px 13px;font-size:11px}
  .btn:disabled{opacity:.5;cursor:default}

  /* login */
  #login{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px;text-align:center;box-shadow:0 20px 50px rgba(75,16,24,.08)}
  #login h1{font-family:Georgia,serif;font-size:24px;margin-bottom:6px}
  #login p{color:var(--muted);font-size:14px;margin-bottom:20px}
  #login input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:12px;text-align:center;letter-spacing:2px}
  #login .err{color:#b23b3b;font-size:13px;min-height:18px;margin-bottom:8px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .topbar h2{font-family:Georgia,serif;font-size:22px}
  .count{color:var(--muted);font-size:14px}
  .searchrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .searchrow input{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 8px 22px rgba(75,16,24,.05)}
  .card .nm{font-family:Georgia,serif;font-size:19px;color:var(--wine);margin-bottom:2px}
  .card .wa{font-size:14px;margin-bottom:12px}
  .card .wa a{color:var(--gold);text-decoration:none;font-weight:bold}
  .row{display:flex;gap:8px;font-size:13.5px;padding:5px 0;border-top:1px dashed var(--line)}
  .row .l{color:var(--muted);min-width:96px;flex:none}
  .row .v{color:var(--ink)}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
  .card .dt{font-size:11.5px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty .big{font-size:40px;margin-bottom:10px}
  .hint{font-size:12px;color:var(--muted);margin-top:26px;text-align:center;line-height:1.6}
</style></head>
<body>

<div id="app" hidden>
  <header>
    <div class="brand"><div class="nm">Carolina Rodrigues</div><div class="sb">Painel de Cadastros · Psicóloga</div></div>
    <div class="tools">
      <button class="btn light sm" onclick="carregar()">↻ Atualizar</button>
      <button class="btn light sm" onclick="baixarTodos()">⬇ PDF de todos</button>
      <button class="btn ghost sm" style="color:#fff;border-color:rgba(255,255,255,.5)" onclick="sair()">Sair</button>
    </div>
  </header>
  <div class="wrap">
    <div class="topbar"><h2>Pacientes cadastrados</h2><span class="count" id="count"></span></div>
    <div class="searchrow"><input id="busca" placeholder="Buscar por nome ou WhatsApp..." oninput="render()"></div>
    <div id="lista" class="grid"></div>
    <div class="hint">🔒 Dados sigilosos (LGPD). Use apenas para o contato inicial. Cada PDF pode ser salvo no computador da Carolina.</div>
  </div>
</div>

<div id="login">
  <h1 class="serif">Painel da Carolina</h1>
  <p>Digite a senha de acesso para ver os cadastros.</p>
  <div class="err" id="loginErr"></div>
  <input type="password" id="senha" placeholder="senha" onkeydown="if(event.key==='Enter')entrar()">
  <button class="btn" style="width:100%;justify-content:center" onclick="entrar()">Entrar</button>
</div>

<script>
const { jsPDF } = window.jspdf;
let LEADS = [];
let CODE = sessionStorage.getItem('carol-code') || '';

function esc(s){ return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtData(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return iso; const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function waLink(w){ const dig=(w||'').replace(/\D/g,''); if(!dig) return null; const num = dig.length<=11 ? '55'+dig : dig; return 'https://wa.me/'+num; }

async function carregar(){
  try{
    const r = await fetch('/api/leads', { headers:{ 'x-access-code': CODE } });
    if(r.status===401){ sair('Senha incorreta.'); return; }
    const j = await r.json();
    if(!j.ok){ throw new Error(j.error||'erro'); }
    LEADS = (j.leads||[]).slice().reverse(); // mais recentes primeiro
    document.getElementById('login').hidden = true;
    document.getElementById('app').hidden = false;
    render();
  }catch(e){ sair('Não foi possível carregar. Tente de novo.'); }
}
function entrar(){
  const s = document.getElementById('senha').value.trim();
  if(!s){ return; }
  CODE = s; sessionStorage.setItem('carol-code', s);
  document.getElementById('loginErr').textContent='';
  carregar();
}
function sair(msg){
  CODE=''; sessionStorage.removeItem('carol-code');
  document.getElementById('app').hidden = true;
  document.getElementById('login').hidden = false;
  document.getElementById('senha').value='';
  document.getElementById('loginErr').textContent = msg||'';
}

function render(){
  const q = (document.getElementById('busca').value||'').toLowerCase().trim();
  const list = LEADS.filter(l => !q || (l.nome||'').toLowerCase().includes(q) || (l.whatsapp||'').toLowerCase().includes(q));
  document.getElementById('count').textContent = LEADS.length + ' cadastro(s)' + (q? ' · '+list.length+' encontrado(s)':'');
  const el = document.getElementById('lista');
  if(!list.length){ el.outerHTML='<div id="lista" class="grid"></div>'; document.getElementById('lista').innerHTML='<div class="empty" style="grid-column:1/-1"><div class="big">🗂️</div>'+(LEADS.length?'Nenhum resultado para a busca.':'Ainda não há cadastros.')+'</div>'; return; }
  el.innerHTML = list.map((l,i)=>{
    const wl = waLink(l.whatsapp);
    return `<div class="card">
      <div class="nm">${esc(l.nome)||'(sem nome)'}</div>
      <div class="wa">${wl?`<a href="${wl}" target="_blank">📱 ${esc(l.whatsapp)}</a>`:esc(l.whatsapp||'—')}</div>
      <div class="row"><span class="l">Encontrou por</span><span class="v">${esc(l.origem)||'—'}</span></div>
      <div class="row"><span class="l">Motivo</span><span class="v">${esc(l.motivo)||'—'}</span></div>
      <div class="row"><span class="l">Expectativa</span><span class="v">${esc(l.expectativa)||'—'}</span></div>
      <div class="foot"><span class="dt">🕒 ${fmtData(l.criadoEm)}</span><span style="display:flex;gap:8px"><button class="btn ghost sm" onclick="excluir('${l.id}')" title="Excluir cadastro">🗑</button><button class="btn sm" onclick="baixarPDF(${LEADS.indexOf(l)})">⬇ PDF</button></span></div>
    </div>`;
  }).join('');
}

async function excluir(id){
  const l = LEADS.find(x => x.id === id);
  if(!l) return;
  if(!confirm('Excluir o cadastro de "' + (l.nome||'(sem nome)') + '"? Essa ação não pode ser desfeita.')) return;
  try{
    const r = await fetch('/api/leads', { method:'DELETE', headers:{ 'Content-Type':'application/json', 'x-access-code': CODE }, body: JSON.stringify({ id:id }) });
    if(r.status === 401){ sair('Sessão expirada. Entre de novo.'); return; }
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'erro');
    const i = LEADS.findIndex(x => x.id === id);
    if(i >= 0) LEADS.splice(i, 1);
    render();
  }catch(e){ alert('Não foi possível excluir agora. Tente de novo.'); }
}

// ---------- PDF ----------
const WINE=[75,16,24], INK=[59,29,29], MUT=[114,94,87], GOLD=[161,125,112];
function pagPaciente(doc, l){
  // cabecalho vinho
  doc.setFillColor(...WINE); doc.rect(0,0,210,30,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('times','normal'); doc.setFontSize(19); doc.text('Carolina Rodrigues', 16, 16);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(232,207,198);
  doc.text('PSICÓLOGA · CRP 05/70645', 16, 23);
  // titulo
  doc.setTextColor(...WINE); doc.setFont('times','bold'); doc.setFontSize(20);
  doc.text('Ficha de Primeiro Contato', 16, 48);
  doc.setDrawColor(200,180,172); doc.setLineWidth(0.4); doc.line(16,52,194,52);

  const campos = [
    ['Nome', l.nome],
    ['WhatsApp', l.whatsapp],
    ['Como me encontrou', l.origem],
    ['O que motivou buscar terapia', l.motivo],
    ['O que espera encontrar', l.expectativa],
    ['Data do cadastro', fmtData(l.criadoEm)]
  ];
  let y = 66;
  campos.forEach(([lab,val])=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...MUT);
    doc.text((lab||'').toUpperCase(), 16, y);
    doc.setFont('times','normal'); doc.setFontSize(13.5); doc.setTextColor(...INK);
    const linhas = doc.splitTextToSize((val && (''+val).trim()) || '—', 178);
    doc.text(linhas, 16, y+7);
    y += 7 + linhas.length*7 + 8;
    doc.setDrawColor(230,222,214); doc.setLineWidth(0.3); doc.line(16, y-6, 194, y-6);
  });

  // rodape
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...MUT);
  doc.text('Documento de uso interno e sigiloso · LGPD — utilizado apenas para o contato inicial.', 16, 285);
  doc.setTextColor(...GOLD);
  doc.text('Cuidar de si também é possível.', 16, 291);
}
function nomeArq(l){ const nm=(l.nome||'paciente').replace(/[^\p{L}\p{N} ]/gu,'').trim().replace(/\s+/g,' ')||'paciente'; return 'Paciente - '+nm+'.pdf'; }
function baixarPDF(idx){
  const l = LEADS[idx]; if(!l) return;
  const doc = new jsPDF();
  pagPaciente(doc, l);
  doc.save(nomeArq(l));
}
function baixarTodos(){
  if(!LEADS.length){ return; }
  const doc = new jsPDF();
  LEADS.forEach((l,i)=>{ if(i>0) doc.addPage(); pagPaciente(doc, l); });
  const hoje = new Date(); const p=n=>String(n).padStart(2,'0');
  doc.save('Pacientes - Carolina - '+p(hoje.getDate())+'-'+p(hoje.getMonth()+1)+'-'+hoje.getFullYear()+'.pdf');
}

// auto-login se ja tinha senha na sessao
if(CODE){ carregar(); } else { document.getElementById('senha').focus(); }
</script>
</body></html>
